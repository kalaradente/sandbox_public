<meta charset="utf-8">
<title>Lab Review Pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One look on purpose: a dark screening room, same verdict colours as the desk review page (review/index.html). */
  :root {
    color-scheme: dark;
    --bg: #0d0e10; --panel: #16181b; --raise: #1e2125; --line: #2a2d32; --text: #eceef1; --muted: #979ea7;
    --perfect: #e0b341; --kept: #3fb27f; --deleted: #e5534b; --focus: #8ab4ff;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); margin: 0; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 12px 28px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
  select { flex: 1 1 180px; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
           padding: 9px 12px; font: 500 14px var(--mono); }
  .tally { font: 500 12px var(--mono); color: var(--muted); display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--text); font-weight: 500; }

  .strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .pip { flex: none; min-width: 38px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
         font: 500 12px var(--mono); display: grid; place-items: center; cursor: pointer; padding: 0 6px; }
  .pip.on { border-color: var(--focus); color: var(--text); }
  .pip.perfect { background: color-mix(in srgb, var(--perfect) 22%, var(--panel)); color: var(--perfect); }
  .pip.kept { background: color-mix(in srgb, var(--kept) 22%, var(--panel)); color: var(--kept); }
  .pip.deleted { background: color-mix(in srgb, var(--deleted) 22%, var(--panel)); color: var(--deleted); }

  .stage { position: relative; background: #000; border-radius: 14px; overflow: hidden; touch-action: pan-y; display: grid; place-items: center; }
  .stage.v916 { aspect-ratio: 9 / 16; max-height: 66vh; margin: 0 auto; width: auto; max-width: 100%; }
  .stage.v169 { aspect-ratio: 16 / 9; width: 100%; }
  .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .stage .gone { color: var(--muted); padding: 24px; text-align: center; }
  .count { position: absolute; top: 10px; left: 10px; font: 500 12px var(--mono); background: rgb(0 0 0 / .55); padding: 3px 8px; border-radius: 6px; pointer-events: none; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .id { font: 500 18px var(--mono); font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .caption { font-size: 20px; line-height: 1.3; font-weight: 500; text-wrap: balance; margin: 0; }
  .caption.none { font-size: 14px; color: var(--muted); font-weight: 400; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details p { margin: 8px 0 0; color: #c9ced4; font-size: 14px; }

  .lab { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line);
             border-radius: 12px; padding: 10px 12px; font: 15px/1.4 var(--sans); }
  textarea:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }

  .topics { display: flex; flex-wrap: wrap; gap: 8px; }
  .t { min-height: 40px; border: 1px solid var(--line); background: var(--raise); color: var(--muted); border-radius: 999px; padding: 0 14px; font: 500 14px var(--sans); cursor: pointer; }
  .t.on { background: color-mix(in srgb, var(--focus) 24%, var(--panel)); border-color: var(--focus); color: var(--text); }
  .t:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .v { border: 1px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 14px 6px; font: 600 15px var(--sans); cursor: pointer; }
  .v:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .v.perfect.sel { background: var(--perfect); border-color: var(--perfect); color: #1b1503; }
  .v.kept.sel { background: var(--kept); border-color: var(--kept); color: #04150d; }
  .v.deleted.sel { background: var(--deleted); border-color: var(--deleted); color: #1c0504; }
  .v.perfect:not(.sel) { color: var(--perfect); } .v.kept:not(.sel) { color: var(--kept); } .v.deleted:not(.sel) { color: var(--deleted); }

  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .status.ok { color: var(--kept); }
  .status.err { color: var(--deleted); }
  .nav { display: flex; justify-content: space-between; gap: 8px; }
  .nav button { flex: 1; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 10px; font: 500 14px var(--sans); cursor: pointer; }
  .nav button:disabled { opacity: .35; }

  .done { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .done h2 { margin: 0; font-size: 17px; }
  .done code { font: 500 14px var(--mono); background: var(--raise); padding: 2px 6px; border-radius: 6px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (prefers-reduced-motion: no-preference) { .stage { transition: opacity .15s; } .stage.fading { opacity: .25; } }
</style>

<div class="wrap">
  <header>
    <h1>Lab review</h1>
    <select id="round" aria-label="Round"></select>
    <div class="tally" id="tally"></div>
  </header>
  <div class="strip" id="strip" aria-label="Edits in this round"></div>
  <main id="main"><p class="empty" id="empty">Loading rounds…</p></main>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const LABEL = { perfect: "Perfect", kept: "Keep", deleted: "Delete" };
  let db = null, rounds = {}, verdicts = {}, cur = null, idx = 0, noteTimer = null;
  const chains = {};  // one write at a time per verdict doc
  const sending = {}, held = {}, unsent = {};  // while a write is on its way, held = what the database has; unsent = a note whose save failed, still in its box

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  function edits() { return (rounds[cur] && rounds[cur].edits) || []; }
  function state(e) {  // what the phone says, else what the Mac said when the round was sent (a verdict from before taps: the Mac's taps)
    const v = verdicts[e.id];
    if (v && v.round === cur) return { decision: v.decision || "", note: v.note || "", topics: v.topics || e.topics || [], applied: !!v.applied, mine: true };
    return { decision: e.decision || "", note: e.note || "", topics: e.topics || [], applied: true, mine: false };
  }
  const topicNames = () => (rounds[cur] && rounds[cur].topic_names) || [];  // the Mac's list (serve.py TOPICS), sent with the round
  function verdict(e, decision, note, topics) {  // the verdicts/<id> doc
    const b = { round: cur, id: e.id, decision, note, at: new Date().toISOString(), applied: false };
    if (topicNames().length) b.topics = topics;  // a round sent before taps: no topics, so phone.py apply leaves the Mac's as they are
    return b;
  }
  const short = (id) => id.replace(/^R[\d.]+_/, "");

  function renderRounds() {
    const names = Object.keys(rounds).sort((a, b) => (rounds[b].pushed || "").localeCompare(rounds[a].pushed || ""));
    const sel = $("#round");
    sel.innerHTML = "";
    names.forEach((n) => { const o = document.createElement("option"); o.value = n; o.textContent = n.replace(/_(\d{4})-(\d\d)-(\d\d)$/, "  ·  $2/$3"); sel.appendChild(o); });
    if (!names.length) { $("#main").innerHTML = '<p class="empty">No rounds sent yet. Ask Claude to send one.</p>'; $("#tally").textContent = ""; $("#strip").innerHTML = ""; return; }
    if (!rounds[cur]) {
      const saved = store.get("round");
      cur = rounds[saved] ? saved : names[0];
      idx = firstOpen();
    }
    sel.value = cur;
    render();
  }

  function firstOpen() { const i = edits().findIndex((e) => !state(e).decision); return i < 0 ? 0 : i; }

  function renderTally() {
    const n = { perfect: 0, kept: 0, deleted: 0 }, es = edits();
    es.forEach((e) => { const d = state(e).decision; if (n[d] !== undefined) n[d]++; });
    const decided = n.perfect + n.kept + n.deleted;
    $("#tally").innerHTML = `<span><b>${decided}</b>/${es.length}</span><span style="color:var(--perfect)">${n.perfect}★</span><span style="color:var(--kept)">${n.kept} keep</span><span style="color:var(--deleted)">${n.deleted} del</span>`;
    return decided === es.length && es.length > 0;
  }

  function renderStrip() {
    const strip = $("#strip"); strip.innerHTML = "";
    edits().forEach((e, i) => {
      const b = document.createElement("button");
      b.className = "pip " + state(e).decision + (i === idx ? " on" : "");
      b.textContent = short(e.id); b.setAttribute("aria-label", e.id + " " + (LABEL[state(e).decision] || "undecided"));
      b.onclick = () => go(i);
      strip.appendChild(b);
      if (i === idx) requestAnimationFrame(() => b.scrollIntoView({ block: "nearest", inline: "center" }));
    });
  }

  function statusFor(e) {
    const s = state(e);
    if (!s.decision) return ["", ""];
    if (!s.mine) return ["ok", `On the Mac as ${LABEL[s.decision] || s.decision}.`];
    return s.applied ? ["ok", `${LABEL[s.decision]} · applied on the Mac.`] : ["", `${LABEL[s.decision]} · saved. Waiting for Claude to apply it on the Mac.`];
  }

  function render() {
    const es = edits(); if (!es.length) return;
    idx = Math.max(0, Math.min(idx, es.length - 1));
    store.set("round", cur);
    const allDone = renderTally(); renderStrip();
    const e = es[idx], s = state(e), vert = e.format !== "16:9";
    const main = $("#main");
    const shown = main.querySelector("#stage");
    const sameClip = shown && shown.dataset.id === e.id;
    if (!sameClip) {
      main.innerHTML = `
        <div class="stage ${vert ? "v916" : "v169"}" id="stage" data-id="${e.id}">
          ${e.asset ? `<video id="vid" src="/_blob/${e.asset}#t=0.001" controls playsinline loop preload="auto"></video>` : `<p class="gone">No video for this edit.</p>`}
          <span class="count">${idx + 1} / ${es.length}</span>
        </div>
        <div class="head"><span class="id"></span><div class="chips"></div></div>
        <p class="caption"></p>
        <details><summary>The plan</summary><p class="story"></p><p class="why"></p></details>
        <span class="lab" id="whyLab">Why · tap any, or none</span>
        <div class="topics" role="group" aria-labelledby="whyLab"></div>
        <label class="lab" for="note">Note</label>
        <textarea id="note" placeholder="What works, what to change…"></textarea>
        <div class="verdicts">
          <button class="v perfect" data-d="perfect">Perfect</button>
          <button class="v kept" data-d="kept">Keep</button>
          <button class="v deleted" data-d="deleted">Delete</button>
        </div>
        <div class="status" id="status" role="status"></div>
        <div class="nav"><button id="prev">‹ Previous</button><button id="next">Next ›</button></div>
        <div id="done"></div>`;
      main.querySelector(".id").textContent = e.id;
      const chips = main.querySelector(".chips");
      [e.account_name, e.window, e.format, e.lyrics ? "lyrics" : ""].filter(Boolean).forEach((t) => { const c = document.createElement("span"); c.className = "chip"; c.textContent = t; chips.appendChild(c); });
      const cap = main.querySelector(".caption");
      cap.textContent = e.caption || (e.lyrics ? "Lyrics on screen, no caption" : "No caption");
      cap.classList.toggle("none", !e.caption);
      main.querySelector(".story").textContent = e.story || "";
      main.querySelector(".why").textContent = e.why || "";
      main.querySelector("details").hidden = !(e.story || e.why);
      const tp = main.querySelector(".topics");
      topicNames().forEach(([k, l]) => { const b = document.createElement("button"); b.className = "t"; b.dataset.t = k; b.textContent = l; b.onclick = () => tapTopic(k); tp.appendChild(b); });
      tp.hidden = $("#whyLab").hidden = !topicNames().length;  // a round sent before taps has no list
      const note = $("#note"); note.value = s.note; delete unsent[e.id];
      note.oninput = () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNote, 1200); };
      note.onblur = saveNote;
      main.querySelectorAll(".v").forEach((b) => b.onclick = () => decide(b.dataset.d));
      $("#prev").onclick = () => go(idx - 1);
      $("#next").onclick = () => go(idx + 1);
      swipe($("#stage"));
    }
    main.querySelectorAll(".v").forEach((b) => b.classList.toggle("sel", b.dataset.d === s.decision));
    main.querySelectorAll(".t").forEach((b) => { const on = s.topics.includes(b.dataset.t); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
    const note = $("#note"); if (document.activeElement !== note && note.value !== s.note && !unsent[e.id]) note.value = s.note;
    $("#prev").disabled = idx === 0; $("#next").disabled = idx === es.length - 1;
    const st = $("#status"), [cls, msg] = statusFor(e);
    if (!st.dataset.hold) { st.className = "status " + cls; st.textContent = msg; }
    const pending = es.filter((x) => { const v = verdicts[x.id]; return v && v.round === cur && !v.applied; }).length;
    $("#done").innerHTML = allDone ? `<div class="done"><h2>All ${es.length} decided</h2><div>${pending ? `${pending} waiting for the Mac. In the Claude app, tell Claude <code>apply the phone review</code>.` : "Everything here is applied on the Mac."}</div></div>` : "";
  }

  function go(i) {
    const es = edits(); if (i < 0 || i >= es.length || i === idx) return;
    saveNote();
    const stage = $("#stage"); if (stage) stage.classList.add("fading");
    idx = i; setTimeout(render, 90);
  }

  function write(id, body) {  // a save that fails never blocks the next one (the desk page's queue, review/index.html, does the same), and the edit goes back to what the database has
    if (!sending[id]) held[id] = verdicts[id];
    sending[id] = (sending[id] || 0) + 1; verdicts[id] = body;
    const p = (chains[id] || Promise.resolve()).then(() => db.doc("verdicts/" + id).set(body)).then(
      () => { sending[id]--; held[id] = body; delete unsent[id]; },
      (err) => {  // the verdict and the taps are unlit again; what was typed stays in the box, and the next tap sends it
        if (!--sending[id]) { if (held[id]) verdicts[id] = held[id]; else delete verdicts[id]; unsent[id] = true; }
        throw err;
      });
    chains[id] = p.catch(() => {});
    return p;
  }

  async function decide(d) {
    if (!db) return flash("err", "Can't save here: open this page in claude.ai.");
    const e = edits()[idx], s = state(e), note = $("#note").value.trim();
    const decision = s.mine && s.decision === d ? "" : d;  // tap the lit one again to clear it
    const body = verdict(e, decision, note, s.topics);
    const saved = write(e.id, body); render();
    try {
      await saved;
      if (decision) {
        const next = edits().findIndex((x, i) => i > idx && !state(x).decision);
        if (next >= 0) setTimeout(() => go(next), 450);
      }
    } catch (err) { render(); flash("err", "Didn't save (" + (err && err.code || "error") + "). Tap again."); }
  }

  async function saveNote() {
    clearTimeout(noteTimer);
    const n = $("#note"); if (!n || !db) return;
    const e = edits()[idx], s = state(e), note = n.value.trim();
    if (note === (s.note || "").trim()) return;
    const body = verdict(e, s.decision, note, s.topics);
    try { await write(e.id, body); flash("", "Note saved."); } catch (err) { flash("err", "Note didn't save (" + (err && err.code || "error") + ")."); }
  }

  async function tapTopic(k) {  // saved at once, with the verdict and the note as they are; a tap on its own is not a verdict
    if (!db) return flash("err", "Can't save here: open this page in claude.ai.");
    const e = edits()[idx], s = state(e), order = topicNames().map((t) => t[0]);
    const topics = (s.topics.includes(k) ? s.topics.filter((x) => x !== k) : [...s.topics, k]).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const body = verdict(e, s.decision, $("#note").value.trim(), topics);
    const saved = write(e.id, body); render();
    try { await saved; } catch (err) { render(); flash("err", "Didn't save (" + (err && err.code || "error") + "). Tap again."); }
  }

  function flash(cls, msg) {
    const st = $("#status"); if (!st) return;
    st.className = "status " + cls; st.textContent = msg; st.dataset.hold = "1";
    setTimeout(() => { delete st.dataset.hold; render(); }, 2200);
  }

  function swipe(el) {
    if (!el) return;
    let x0 = null, y0 = null, t0 = 0;
    el.addEventListener("touchstart", (ev) => { const t = ev.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
    el.addEventListener("touchend", (ev) => {
      if (x0 === null) return;
      const t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - t0 < 700) go(idx + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }

  document.addEventListener("keydown", (ev) => {
    if (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") return;
    if (ev.key === "ArrowRight") go(idx + 1); else if (ev.key === "ArrowLeft") go(idx - 1);
    else if (ev.key === "p") decide("perfect"); else if (ev.key === "k") decide("kept"); else if (ev.key === "d") decide("deleted");
    else if (/^[1-9]$/.test(ev.key) && topicNames()[+ev.key - 1]) tapTopic(topicNames()[+ev.key - 1][0]);
  });

  $("#round").onchange = (ev) => { saveNote(); cur = ev.target.value; idx = firstOpen(); $("#main").innerHTML = ""; render(); };

  (async () => {
    db = await window.claude?.use?.("db");
    if (!db) { $("#empty").textContent = "Open this page in claude.ai or the Claude app to load your rounds."; return; }
    const fail = (err) => { $("#main").innerHTML = `<p class="empty">Couldn't load rounds (${err && err.code || "error"}). Reload to try again.</p>`; };
    db.collection("rounds").onSnapshot((snap) => { rounds = {}; snap.docs.forEach((d) => { rounds[d.id] = d.data(); }); renderRounds(); }, fail);
    db.collection("verdicts").onSnapshot((snap) => {
      snap.docs.forEach((d) => { const v = d.data(), mine = verdicts[d.id]; if (!(mine && !mine.applied && mine.at > (v.at || ""))) verdicts[d.id] = v; });
      if (cur) render();
    }, fail);
  })();
})();
</script>
